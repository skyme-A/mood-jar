<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="manifest.json" />
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFF0F5" id="theme-meta" />
    <title>Pocket Sunshine 🌸</title>
    <style>
        :root {
            --bg: #FFF0F5;
            --card: #FFE4E1;
            --accent: #D1527A;
            --btn: #FFB6C1;
            --btn-hover: #FF69B4;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Comic Sans MS", "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            transition: background-color 0.3s ease;
            overflow: hidden;
        }

        .card-container {
            background-color: var(--card);
            border: 2px solid var(--accent);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        h2 {
            color: var(--accent);
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .icon {
            font-size: 58px;
            line-height: 1.2;
            margin: 15px 0;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
        }

        p {
            color: #4A4A4A;
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 52px;
            margin: 10px 0 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background-color: var(--btn);
            color: white;
            border: none;
            width: 100%;
            max-width: 200px;
            padding: 13px 20px;
            font-size: 1rem;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        button:active {
            transform: scale(0.94);
            background-color: var(--btn-hover);
        }
    </style>
</head>

<body>

    <div class="card-container">
        <h2>✨ Daily Sunshine Jar ✨</h2>
        <div class="icon" id="icon">🌸</div>
        <p id="msg">Tap below to reveal a sweet little reminder! (｡♥‿♥｡)</p>
        <button onclick="drawNote()">Open Note 💖</button>
    </div>

    <script>
        const notes = [
            { text: "Take a deep breath, you are doing amazing! 🌸", icon: "💖" },
            { text: "Late-night coding magic is real, but don't forget to hydrate! 💧", icon: "✨" },
            { text: "Time for a cozy break and a warm cup of coffee ☕", icon: "🫧" },
            { text: "Small steady progress beats perfection every time 🌷", icon: "🍀" },
            { text: "Sending you warm hugs and 100% sparkling vibes! 🎀", icon: "🥰" },
            { text: "Drop your shoulders, relax your jaw, and smile! 🧸", icon: "🌟" }
        ];

        const themes = [
            { bg: "#FFF0F5", card: "#FFE4E1", accent: "#D1527A", btn: "#FFB6C1", hover: "#FF69B4" },
            { bg: "#F4F0FF", card: "#EAE4F8", accent: "#8A64D0", btn: "#C7B2E8", hover: "#A27CE6" },
            { bg: "#F0FFF0", card: "#E2F6E2", accent: "#438A5E", btn: "#A3E4B8", hover: "#6AC98A" },
            { bg: "#FFF9E6", card: "#FFF0C2", accent: "#C98A2C", btn: "#FFE28A", hover: "#F5C84C" }
        ];

        function drawNote() {
            const note = notes[Math.floor(Math.random() * notes.length)];
            const theme = themes[Math.floor(Math.random() * themes.length)];

            document.documentElement.style.setProperty('--bg', theme.bg);
            document.documentElement.style.setProperty('--card', theme.card);
            document.documentElement.style.setProperty('--accent', theme.accent);
            document.documentElement.style.setProperty('--btn', theme.btn);
            document.documentElement.style.setProperty('--btn-hover', theme.hover);

            const themeMeta = document.getElementById('theme-meta');
            if (themeMeta) themeMeta.setAttribute('content', theme.bg);

            document.getElementById('icon').innerText = note.icon;
            document.getElementById('msg').innerText = note.text;
        }
    </script>
</body>

</html>
